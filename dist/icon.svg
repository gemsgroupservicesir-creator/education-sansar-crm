<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Graduation Cap Icon in White with subtle drop shadow -->
  <g filter="url(#shadow)" transform="translate(64, 76) scale(16)">
    <!-- Mortarboard Top -->
    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z" fill="#ffffff" />
    <path d="M3.45 9L12 4.34 20.55 9 12 13.66 3.45 9z" fill="#f8fafc" />
    <!-- Tassel and Cap Base -->
    <path d="M5 13.18v4L12 21l7-3.82v-4L12 17.27l-7-4.09z" fill="#ffffff" />
  </g>

  <!-- Gems Group Services Brand Pill / Star -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="rgba(15, 23, 42, 0.4)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="3">GEMS CRM</text>
  </g>
</svg>
